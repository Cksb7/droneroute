
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droneroute"
version = "0.1.0"
description = "Simulador modular de otimização de entregas por drones."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "matplotlib>=3.9,<4.0"
]

[tool.setuptools.packages.find]
where = ["src"]
